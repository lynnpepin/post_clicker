<link rel="stylesheet" href="style.css">

<div id="da_game">

  <div id="pane_stats">
    <button id="genius_button" onclick="click_genius()" >🧠</button><br>
    <label id="genius_per_click" style="float:end;color:#999;">1</label>
    <br><br>
    <div id="genius_container">
      <div id="genius_row">
        <label style="font-size:.8em;letter-spacing:-0.05rem;font-weight:900;margin-left:.5em;">Genius</label>
        <input type="number" id="genius_level" disabled value="0"></input>
      </div>
    <progress id="genius_level_progress" max="1" value="0"></progress>
    </div>

    <br>
    <div id="ego_container" style="opacity:0"> 
      <div class="row" style="flex-direction:row">
        <label style="font-size:.8em;letter-spacing:-0.05rem;font-weight:900;margin-left:.5em;color:#777;">Ego</label>
        <label style="font-size:.7em;letter-spacing:-0.05rem;font-weight:600;margin-left:.5em;color:#999;">(genius / sec)</label>
      </div>
      <input type="number" id="ego_level" disabled value="0"></input>
    </div>
    <br>
    <div id="followers_container" style="opacity:0">
      <label style="font-size:.8em;letter-spacing:-0.05rem;font-weight:900;margin-left:.5em;color:#777;">Followers</label>
      <input type="number" id="follower_level" disabled value="0"></input>
    </div>
    <hr>
    <div id="population_container" style="opacity:0">
      <label style="font-size:.8em;letter-spacing:-0.05rem;font-weight:900;margin-left:.5em;color:#777;">World Population</label>
      <input type="number" id="population_level" disabled value="6967420621"></input>
    </div>
  </div>

  <div id="pane_feed">

    <div id="post_box" style="opacity:0">
      <textarea id="post_input" type="text" value=""  disabled>
      </textarea>
      <div id="post_box_bottom">
        <div id="post_pie"></div>
        <button disabled id="post_send" onclick="post_send()" >⌲</button>
      </div>
    </div>

    <hr>

    <div id="post_feed">
    </div>

  </div>

</div>

<template id="post_template">
  <div class="post_container">
    <p class="post_text">
    </p>
    <hr>
    <div class="post_container_bottom">
      <div class="post_container_reposts">
        <button class="repost_button">🔁</button>
        <input class="repost_count" type=number disabled value=0></input>
      </div>
      <div class="post_container_likes">
        <button class="like_button">❤️</button>
        <input class="like_count" type=number disabled value=0></input>
      </div>
    </div>
  </div>
</template>

<script src="script.js"></script>
