<link rel="stylesheet" href="style.css">

<div id="da_game">

  <div id="pane_stats">
    <button id="genius_button" onclick="click_genius()" >🧠</button>
    <br><br>
    <div id="genius_container">
      <div id="genius_row">
        <label style="font-size:.8em;letter-spacing:-0.05rem;font-weight:900;margin-left:.5em;">Genius</label>
        <input type="number" id="genius_level" disabled></input>
      </div>
    <progress id="genius_level_progress" max="1" value="0"></progress>
    </div>
    
    <br>
    <div id="ego_container">
      <label style="font-size:.8em;letter-spacing:-0.05rem;font-weight:900;margin-left:.5em;">Ego</label>
      <input type="number" id="ego_level" disabled></input>
    </div>
    <hr>
  </div>

  <div id="pane_feed">

    <div id="post_box">
      <textarea id="post_input" type="text" value=""  disabled>
      </textarea>
      <div id="post_box_bottom">
        <div id="post_pie"></div>
        <button disabled id="post_send" onclick="post_send()" >⌲</button>
      </div>
    </div>

    <hr>

    <div id="post_feed">
    </div>

  </div>

</div>

<template id="post_template">
  <div class="post_container">
    <p class="post_text">
    </p>
    <hr>
    <div class="post_container_bottom">
      <div class="post_container_likes">
      ❤️ ♻️
    </div>
  </div>
</template>

<script src="script.js"></script>
